name: Daily lake level update

on:
  schedule:
    # Hourly, so BMC's ~06:00 IST daily report is picked up soon after it
    # posts even if the exact publish time varies. Most runs find no new
    # data and the commit step is a no-op ("No changes to commit").
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest lake levels
        run: python scripts/fetch_lake_levels.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.csv data/latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update lake levels for $(date -u +%Y-%m-%d)"
            git push
          fi
